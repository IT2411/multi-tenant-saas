# .github/workflows/ci.yml
name: Engine CI Quality & Security Pipeline

on:
  push:
    branches: [ main, master, staging, develop ]
  pull_request:
    branches: [ main, master, staging, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Code Formatting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Execute Ruff Formatting Inspection
        run: ruff format --check .

      - name: Execute Ruff Static Linter
        run: ruff check .

  type-safety:
    name: Static Type Analysis (Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Mypy Type Checker
        run: mypy app

  integration-tests:
    name: Async Integration Suite
    runs-on: ubuntu-latest
    needs: [static-analysis, type-safety]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: test_jira_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Application & Test Harness
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Execute Async Test Suite with Coverage
        env:
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-not-for-production-usage-at-all-abcdef123
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: test_jira_saas
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          alembic upgrade head
          pytest --cov=app --cov-report=xml --cov-report=term-missing tests/