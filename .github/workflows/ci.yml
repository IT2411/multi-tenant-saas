name: Enterprise SaaS CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Code Quality & Static Typing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting & Type Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Inspect Formatting
        run: ruff format --check app tests

      - name: Execute Linter
        run: ruff check app tests

      - name: Run Mypy Type Safety Gate
        run: |
          pip install .[dev]
          mypy app

  integration-tests:
    name: Async Integration & Security Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-types]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: test_multi_tenant_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadminpassword
        ports:
          - 9000:9000
        options: >-
          server /data

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Application & Test Harness
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Apply Database Migrations
        env:
          ENVIRONMENT: testing
          SECRET_KEY: ci-test-secret-key-1234567890-abcdefghijklmnop
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: test_multi_tenant_saas
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: alembic upgrade head

      - name: Execute Pytest Suite with Coverage
        env:
          ENVIRONMENT: testing
          SECRET_KEY: ci-test-secret-key-1234567890-abcdefghijklmnop
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: test_multi_tenant_saas
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadminpassword
          S3_BUCKET_NAME: saas-attachments
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing tests/

  docker-build:
    name: Multi-Stage Docker Image Build
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: multi-tenant-saas-platform:latest